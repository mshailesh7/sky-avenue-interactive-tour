<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Sky Avenue Virtual Tour</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/brand.css">
    <style>
        :root {
            --green-deep: #1a3428;
            --green-card: rgba(22, 46, 36, 0.92);
            --green-border: rgba(201, 166, 107, 0.22);
            --gold-primary: #c9a66b;
            --gold-light: #e8d4b0;
            --gold-gradient: linear-gradient(135deg, #e8d4b0 0%, #c9a66b 45%, #9a7340 100%);
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.62);
            --text-gold: #d4b483;
            --danger-bg: rgba(180, 70, 70, 0.12);
            --danger-border: rgba(220, 120, 120, 0.28);
            --danger-text: #f0b4b4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--green-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0, transparent 8%, transparent 92%, rgba(0, 0, 0, 0.18) 100%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 72px);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(201, 166, 107, 0.08), transparent 42%);
            pointer-events: none;
            z-index: 0;
        }

        .welcome-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .welcome-card {
            background: var(--green-card);
            border: 1px solid var(--green-border);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            padding: 42px 36px 36px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gold-gradient);
        }

        .brand-logo {
            width: min(160px, 50vw);
            height: auto;
            display: block;
            margin: 0 auto 14px;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.28));
        }

        .eyebrow {
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-gold);
            font-weight: 600;
            margin-bottom: 18px;
        }

        .divider {
            width: 72px;
            height: 1px;
            background: var(--gold-gradient);
            margin: 0 auto 22px;
            opacity: 0.85;
        }

        .greeting {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 4vw, 1.75rem);
            color: var(--gold-light);
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .client-name {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 5vw, 2.1rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            word-break: break-word;
        }

        .support {
            color: var(--text-muted);
            font-size: 14.5px;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-primary {
            background: var(--gold-gradient);
            color: #1f2a22;
            box-shadow: 0 8px 24px rgba(154, 115, 64, 0.28);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(154, 115, 64, 0.36);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(201, 166, 107, 0.45);
            color: var(--gold-light);
        }

        .btn-secondary:hover {
            background: rgba(201, 166, 107, 0.1);
            border-color: var(--gold-primary);
            color: #fff;
        }

        .btn-logout {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
        }

        .btn-logout:hover {
            background: rgba(180, 70, 70, 0.22);
            color: #fff;
        }

        .hint {
            margin-top: 22px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.38);
            line-height: 1.5;
        }

        .loading {
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding-top: max(20px, env(safe-area-inset-top));
            }

            .welcome-card {
                padding: 28px 18px 24px;
                border-radius: 14px;
            }

            .brand-logo {
                width: min(136px, 44vw);
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 0.14em;
            }

            .support {
                font-size: 13.5px;
                margin-bottom: 22px;
            }

            .btn {
                padding: 13px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-card">
            <img src="/assets/sky-avenue-logo.png" alt="Sky Avenue" class="brand-logo">
            <p class="eyebrow">Admin · Interactive 360° Virtual Tour</p>
            <div class="divider"></div>

            <div id="welcomeContent" class="loading">Loading...</div>
        </div>
    </div>

    <script>
        async function loadWelcome() {
            const content = document.getElementById('welcomeContent');

            try {
                const response = await fetch('/api/me');
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();
                if (!data.is_admin) {
                    window.location.href = '/welcome';
                    return;
                }

                const name = data.name || 'Admin';
                content.innerHTML = `
                    <p class="greeting">Welcome</p>
                    <h1 class="client-name">${escapeHtml(name)}</h1>
                    <p class="support">
                        You're signed in as admin.
                    </p>
                    <div class="actions">
                        <a class="btn btn-primary" href="/tour/">View Tour</a>
                        <a class="btn btn-secondary" href="/admin">Admin Panel</a>
                        <form method="POST" action="/logout">
                            <button type="submit" class="btn btn-logout">Logout</button>
                        </form>
                    </div>
                    <p class="hint">
                        Tip: To switch devices later, open this site again and use Logout here before signing in elsewhere.
                    </p>
                `;
            } catch (err) {
                content.innerHTML = '<p class="support">Unable to load your session. Please <a href="/login" style="color: var(--gold-light)">sign in again</a>.</p>';
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        loadWelcome();
    </script>
</body>
</html>
