<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Avenue Virtual Tour</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/brand.css">
    <style>
        :root {
            --green-deep: #1a3428;
            --green-card: rgba(22, 46, 36, 0.92);
            --green-border: rgba(201, 166, 107, 0.22);
            --gold-primary: #c9a66b;
            --gold-light: #e8d4b0;
            --gold-gradient: linear-gradient(135deg, #e8d4b0 0%, #c9a66b 45%, #9a7340 100%);
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.62);
            --text-gold: #d4b483;
            --danger-bg: rgba(180, 70, 70, 0.12);
            --danger-border: rgba(220, 120, 120, 0.28);
            --danger-text: #f0b4b4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            color: var(--text-primary);
            min-height: 100vh;
            background: var(--green-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0, transparent 8%, transparent 92%, rgba(0, 0, 0, 0.18) 100%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 72px);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(201, 166, 107, 0.08), transparent 42%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--green-card);
            border: 1px solid var(--green-border);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            padding: 42px 36px 36px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gold-gradient);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: min(168px, 52vw);
            height: auto;
            display: block;
            margin: 0 auto 14px;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.28));
        }

        .brand-subtitle {
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-gold);
            text-align: center;
            font-weight: 600;
        }

        .brand-divider {
            width: 72px;
            height: 1px;
            background: var(--gold-gradient);
            margin: 18px auto 0;
            opacity: 0.85;
        }

        .header p {
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(201, 166, 107, 0.18);
            border-radius: 10px;
            padding: 13px 15px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .form-input::placeholder { color: rgba(255, 255, 255, 0.32); }

        .form-input:focus {
            border-color: var(--gold-primary);
            background: rgba(0, 0, 0, 0.24);
            box-shadow: 0 0 0 3px rgba(201, 166, 107, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            font-family: var(--font-body);
            font-size: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: var(--gold-gradient);
            color: #1f2a22;
            box-shadow: 0 8px 24px rgba(154, 115, 64, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(154, 115, 64, 0.36);
        }

        .btn-login:active { transform: translateY(0); }

        #errorAlert {
            display: none;
            margin-bottom: 22px;
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.45;
        }

        .btn-login.loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-top: -10px;
            margin-left: -10px;
            border: 2px solid rgba(31, 42, 34, 0.25);
            border-top-color: #1f2a22;
            border-radius: 50%;
            animation: spin 0.8s ease-in-out infinite;
        }

        .footer-note {
            margin-top: 22px;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="header">
            <img src="/assets/sky-avenue-logo.png" alt="Sky Avenue" class="brand-logo">
            <div class="brand-subtitle">Interactive 360° Virtual Tour</div>
            <div class="brand-divider"></div>
            <p>Enter your registered mobile number and password</p>
        </div>

        <div id="errorAlert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-input" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric" pattern="[0-9+\s-]{10,15}" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-login">Login to Access Tour</button>
        </form>

        <p class="footer-note">Project by SZ Realty</p>
    </div>
</div>

<script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        errorAlert.style.display = 'none';
        submitBtn.classList.add('loading');

        const phone = form.phone.value;
        const password = form.password.value;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                window.location.href = result.redirect;
            } else {
                errorAlert.textContent = result.error || 'An unexpected error occurred.';
                errorAlert.style.display = 'block';
                submitBtn.classList.remove('loading');
            }
        } catch (err) {
            errorAlert.textContent = 'Network error. Please try again later.';
            errorAlert.style.display = 'block';
            submitBtn.classList.remove('loading');
        }
    });
</script>
</body>
</html>
